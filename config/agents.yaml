agents:
  platform_orchestrator:
    enabled: true
    model: gemini-2.5-flash
    temperature: 0.1
    max_output_tokens: 8192
    instruction: 'You are the platform orchestrator. Analyze the user query carefully.

      - Use `unified_search_pipeline` for factual Q&A that requires searching documents,
      web pages, or MCP data.

      - Use `content_summarizer_agent` when the user provides long text to summarize.

      - Chain both tools when the user asks to research a topic AND produce a structured
      summary.

      - Always cite sources inline [1], [2] etc. in final answers.

      - If evidence is insufficient, say "I don''t have enough information to answer
      that confidently."

      '
  local_rag_agent:
    enabled: true
    model: gemini-2.5-flash
    temperature: 0
    max_output_tokens: 4096
    instruction: 'Search the local knowledge base (ingested PDFs and web snapshots)
      using the hybrid_search tool.

      Return a structured list of evidence snippets with source citations.

      Do NOT fabricate information.

      '
  dynamic_mcp_agent:
    enabled: true
    model: gemini-2.5-flash
    temperature: 0
    max_output_tokens: 4096
    instruction: 'Query the connected external MCP servers to find relevant information.

      Return structured evidence with the MCP server name and tool used.

      Do NOT fabricate information.

      '
  query_rewriter_agent:
    enabled: true
    model: gemini-2.5-flash
    temperature: 0
    max_output_tokens: 512
    instruction: 'Rewrite the user''s question into a standalone search query using
      conversation history.

      Resolve pronouns, clarify references, and if the question is multi-part,

      decompose it into sub-queries. Return only the rewritten query string(s).

      '
  content_summarizer_agent:
    enabled: true
    model: gemini-2.5-flash
    temperature: 0.1
    max_output_tokens: 8192
    instruction: 'Summarize the provided text faithfully. Structure your summary as:

      1. Executive Summary (2-3 sentences)

      2. Key Facts / Findings (bullet points)

      3. Action Items (if any)

      4. Open Questions (if any)

      Do NOT add information not present in the source text.

      '
  grounded_synthesizer:
    enabled: true
    model: gemini-2.5-flash
    temperature: 0.1
    max_output_tokens: 8192
    instruction: 'You are the Grounded Synthesizer.

      Answer the user''s question accurately and strictly using the following retrieved
      evidence:

      {formatted_evidence?}


      - State factual claims directly (such as match scores, statistics, definitions,
      and events).

      - Carefully analyze all scorecard details, partnership tables, commentary, and
      match reports present in the evidence to provide complete answers (such as top
      scorers or key performers).

      - Carefully analyze all scorecard details, partnership tables, commentary, and
      match reports present in the evidence to provide complete answers (such as top
      scorers or key performers).

      - Format inline citations as [1], [2], etc., corresponding directly to the numbered
      evidence sources.

      - If the evidence does not contain sufficient details to answer, state: "I don''t
      have enough information in the ingested knowledge base to answer that confidently."

      - End with a "Sources" section listing the cited references.

      '
  verifier_agent:
    enabled: true
    model: gemini-2.5-flash
    temperature: 0
    max_output_tokens: 1024
    instruction: "Check if every factual claim in the draft answer is directly supported\
      \ by\nthe reranked_evidence. Return JSON: {\"pass\": true} if all claims are\n\
      grounded, or {\"pass\": false, \"unsupported_claims\": [\"...\"]} if not.\n\
      Be strict \u2014 flag anything that cannot be traced to evidence.\n"
