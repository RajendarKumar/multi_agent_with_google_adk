[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "responsive-agent"
version = "0.1.0"
description = "Configurable multi-agent RAG + MCP platform built on Google ADK"
requires-python = ">=3.11"
dependencies = [
    # --- Agent Framework ---
    "google-adk>=1.0.0",
    "mcp>=1.2.0",

    # --- LLM Clients ---
    "google-generativeai>=0.8.0",
    "openai>=1.40.0",          # fallback / LiteLLM
    "litellm>=1.45.0",

    # --- Document Parsing ---
    "docling>=2.0.0",           # PDF, DOCX, PPTX, HTML, XLSX
    "crawl4ai>=0.4.0",          # Web crawling / Markdown extraction
    "beautifulsoup4>=4.12.0",

    # --- Embeddings & Reranking ---
    "cohere>=5.0.0",            # Cohere Rerank 3.5 + embeddings
    "sentence-transformers>=3.0.0",  # BGE-M3 / local embeddings

    # --- Vector Store ---
    "qdrant-client>=1.11.0",
    "pgvector>=0.3.0",

    # --- Database / ORM ---
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",

    # --- Async Task Queue ---
    "celery>=5.4.0",
    "redis>=5.0.0",

    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # --- Auth & Security ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",

    # --- Observability ---
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "langfuse>=5.2.0",
    "loguru>=0.7.0",

    # --- Utilities ---
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "apscheduler>=3.10.0",     # Configurable refresh scheduler
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ragas>=0.1.21",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "agents*", "config*", "ingestion*", "mcp_registry*", "memory*", "evals*"]
exclude = ["ui*", "uploads*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
